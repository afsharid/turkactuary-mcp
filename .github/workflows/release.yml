name: release

# v* etiketi: test → tekerlek + sdist → PyPI (Trusted Publishing) → MCP Registry (GitHub OIDC).
# Gizli anahtar yok. PyPI tarafında "pending publisher": proje turkactuary-mcp, depo afsharid/turkactuary-mcp,
# iş akışı release.yml, ortam pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag, package and server.json versions match
        run: |
          python - <<'EOF'
          import json, os, re
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          code = re.search(r'__version__ = "([^"]+)"', open("src/actuaryllm_mcp/__init__.py").read()).group(1)
          server = json.load(open("server.json"))
          found = {"tag": tag, "package": code, "server.json": server["version"],
                   "server.json package": server["packages"][0]["version"]}
          assert len(set(found.values())) == 1, found
          print(found)
          EOF
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turkactuary-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the version is live on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/turkactuary-mcp/${version}/json"; then
              echo "PyPI has ${version}"; exit 0
            fi
            sleep 10
          done
          echo "PyPI does not show ${version} after 5 minutes" >&2; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

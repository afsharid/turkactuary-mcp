[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "turkactuary-mcp"
dynamic = ["version"]
description = "Türkiye sigortacılık mevzuatı araması ve aktüeryal hesap araçları için MCP sunucusu"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = []
keywords = ["mcp", "model-context-protocol", "insurance", "actuarial", "turkey", "sigorta", "aktuerya"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Natural Language :: Turkish",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/afsharid/turkactuary-mcp"
Repository = "https://github.com/afsharid/turkactuary-mcp"
Issues = "https://github.com/afsharid/turkactuary-mcp/issues"

[project.scripts]
turkactuary-mcp = "actuaryllm_mcp.server:main"

[tool.hatch.version]
path = "src/actuaryllm_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/actuaryllm", "src/actuaryllm_mcp"]

# Korpus yüklenirken ingestion manifestleri, ham resmî metinler ve inceleme kanıtları sha256 ile doğrulanır;
# üçü de depodaki göreli düzenle pakete girer (actuaryllm_mcp.default_root).
[tool.hatch.build.targets.wheel.force-include]
"data" = "actuaryllm_mcp/_bundle/data"
"artifacts" = "actuaryllm_mcp/_bundle/artifacts"
"evidence" = "actuaryllm_mcp/_bundle/evidence"
